name: 更新景點範圍資料

on:
  schedule:
    - cron: "43 4 * * 1"      # 每週一 04:43 UTC（台灣 12:43），和地鐵資料錯開
  workflow_dispatch:          # 可在 Actions 頁面手動執行
  push:
    paths:
      - scripts/build_poi_data.py
      - .github/workflows/update-poi.yml

permissions:
  contents: write

concurrency:
  group: update-poi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取景點範圍資料（照片地名、雨天備案用）
        run: python scripts/build_poi_data.py
      - name: 有變更就提交
        run: |
          git config user.name "turtlepear"
          git config user.email "turtlepear@users.noreply.github.com"
          git add data/poi-kr.json
          if git diff --cached --quiet; then
            echo "資料沒有變更"
          else
            git commit -m "自動更新景點範圍資料"
            git pull --rebase origin main
            git push
          fi
