name: 更新地鐵路線與出口資料

on:
  schedule:
    - cron: "17 3 * * 1"      # 每週一 03:17 UTC（台灣 11:17）
  workflow_dispatch:          # 可在 Actions 頁面手動執行
  push:
    paths:
      - scripts/build_transit_data.py
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取資料（OpenStreetMap / Overpass）
        run: python scripts/build_transit_data.py
      - name: 有變更就提交
        run: |
          git config user.name "turtlepear"
          git config user.email "turtlepear@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "資料沒有變更"
          else
            git commit -m "自動更新地鐵路線與出口資料"
            git pull --rebase origin main
            git push
          fi
